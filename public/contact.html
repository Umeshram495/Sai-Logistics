<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us – SAI LOGISTICS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:400,500,600&family=Oswald:500,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/app.css"></head>
<body class="sai">
<div class="sai-top"><a href="tel:+919723488420"><i class="fas fa-phone"></i> +91 97234 88420</a><a href="mailto:info@sailogistic.in"><i class="fas fa-envelope"></i> info@sailogistic.in</a></div>
<nav class="sai-nav"><a class="sai-logo" href="/">SAI <span>LOGISTICS</span></a>
<ul><li><a href="/">Home</a></li><li><a href="/services.html">Our Services</a></li><li><a href="/contact.html" class="on">Contact us</a></li></ul></nav>
<section class="sai-hero"><h1>CONTACT US</h1><p>Tell us about your shipment and we will get back to you</p></section>
<main class="wrap"><div class="contact">
  <aside class="info"><h3>Get in touch</h3>
    <p><i class="fas fa-phone"></i> <a href="tel:+919723488420">+91 97234 88420</a><br><i class="fas fa-phone"></i> <a href="tel:+919624807370">+91 96248 07370</a></p>
    <p><i class="fas fa-envelope"></i> <a href="mailto:info@sailogistic.in">info@sailogistic.in</a></p>
  </aside>
  <section>
    <div id="msg" class="notice" role="status"></div>
    <form id="f" class="sai-form" novalidate>
      <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="row2">
        <div><label for="name">Your name *</label><input id="name" name="name" maxlength="100" required><div class="err" data-for="name"></div></div>
        <div><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" maxlength="30" required><div class="err" data-for="phone"></div></div>
      </div>
      <div class="row2">
        <div><label for="email">Email *</label><input id="email" name="email" type="email" maxlength="150" required><div class="err" data-for="email"></div></div>
        <div><label for="company">Company</label><input id="company" name="company" maxlength="150"></div>
      </div>
      <div><label for="service">Service</label><select id="service" name="service"><option value="">Select a service</option></select></div>
      <div><label for="message">Message *</label><textarea id="message" name="message" rows="5" maxlength="2000" required></textarea><div class="err" data-for="message"></div></div>
      <div><button class="btn" id="go" type="submit">SEND MESSAGE</button></div>
    </form>
  </section>
</div></main>
<footer class="sai-foot">&copy; SAI Logistics. All rights reserved.</footer>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
fetch('/api/services').then(r => r.json()).then(list => {
  const sel = document.getElementById('service');
  list.forEach(s => { const o = document.createElement('option'); o.value = s.title; o.textContent = s.title; o.dataset.slug = s.slug; sel.appendChild(o); });
  const want = new URLSearchParams(location.search).get('service');
  if (want) { const o = [...sel.options].find(x => x.dataset.slug === want); if (o) sel.value = o.value; }
});
f.addEventListener('submit', async e => {
  e.preventDefault();
  document.querySelectorAll('.err').forEach(x => x.textContent = '');
  msg.className = 'notice'; msg.textContent = '';
  go.disabled = true; go.textContent = 'SENDING…';
  try {
    const res = await fetch('/api/inquiries', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(f))) });
    const d = await res.json();
    if (res.ok) { msg.className = 'notice ok'; msg.textContent = 'Thank you! Tamaro message mali gayo che, ame jaldi sampark karishu.'; f.reset(); }
    else {
      msg.className = 'notice bad'; msg.textContent = d.error || 'Kaik bhul thai';
      Object.entries(d.errors || {}).forEach(([k, v]) => { const el = document.querySelector('.err[data-for="' + k + '"]'); if (el) el.textContent = v; });
    }
  } catch { msg.className = 'notice bad'; msg.textContent = 'Server sathe connect nathi thatu. Pachi try karo.'; }
  go.disabled = false; go.textContent = 'SEND MESSAGE';
  msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script></body></html>
